name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  native-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/build-macos.sh
      - run: swift test --package-path macos
      - run: swift test --package-path macos -c release
