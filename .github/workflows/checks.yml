name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # CPU inference uses the binaries bundled with onnxruntime-node.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node ../scripts/smoke-runtime.mjs
      - run: node ../scripts/smoke-runtime.mjs --assistant
      - name: Stage the runtime as the app bundles it and start it away from the checkout
        run: |
          OUT="$RUNNER_TEMP/jarvis-bundle/Resources"
          node ../scripts/stage-runtime.mjs --runtime . --out "$OUT" --node "$(command -v node)"
          cd "$RUNNER_TEMP" && node "$GITHUB_WORKSPACE/scripts/smoke-bundle.mjs" "$OUT"
  isolated-workers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JARVIS_WORKER_DOCKER_TESTS: '1'
      JARVIS_WORKER_CODING_TESTS: '1'
      JARVIS_WORKER_KERNEL_TESTS: '1'
      JARVIS_WORKER_IMAGE: python@sha256:2986c55feb36e6cae00fa1fefb454283e4b33f35e75ff8bdd123b134130be301
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: runtime/workers/requirements.txt
      - run: npm --prefix runtime ci
      - run: ./scripts/setup-workers.sh
      - run: echo "JARVIS_WORKER_PYTHON=$PWD/runtime/workers/.venv/bin/python" >> "$GITHUB_ENV"
      - run: docker pull "$JARVIS_WORKER_IMAGE"
      - run: node runtime/workers/setup-image.ts coding --pull
      - run: npm --prefix runtime test
      - name: Check for leaked running workers
        if: always()
        run: test -z "$(docker ps -q --filter label=ai.jarvis.owner)"
  native-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/ci-native.sh ./scripts/build-macos.sh
      - run: ./scripts/ci-native.sh swift test --package-path macos
        env:
          # Renders key screens with fixture state so interface changes can be inspected.
          JARVIS_UI_SNAPSHOT_DIR: ${{ runner.temp }}/jarvis-ui-snapshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-ui-snapshots
          path: ${{ runner.temp }}/jarvis-ui-snapshots
          if-no-files-found: warn
          retention-days: 14
      - run: ./scripts/ci-native.sh swift test --package-path macos -c release
      - run: ./scripts/ci-native.sh swift test --package-path macos-control
      - run: ./scripts/ci-native.sh swift test --package-path macos-control -c release
  package-macos:
    # Builds the self-contained app and disk image for each Mac architecture, starts the
    # bundled services from it, and keeps the result as a downloadable artifact.
    # Pull requests already get this from their branch push.
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: apple-silicon
          - runner: macos-15-intel
            label: intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      # Ad-hoc signed, not notarized.
      - run: ./scripts/ci-native.sh ./scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-macos-${{ matrix.label }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error
          retention-days: 14
